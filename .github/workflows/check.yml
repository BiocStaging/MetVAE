# R CMD check of MetVAE on Linux, macOS, and Windows, with and without the
# LibTorch library of the package torch.
#
# libtorch: true   LibTorch is installed; the model is fitted in the
#                  examples, tests, and vignette.
# libtorch: false  The package torch is installed without LibTorch; the
#                  examples, tests, and vignette use the stored fits.
name: R-CMD-check

on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} (LibTorch ${{ matrix.libtorch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        libtorch: [true, false]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install LibTorch
        if: matrix.libtorch
        run: torch::install_torch()
        shell: Rscript {0}

      - name: Report torch status
        run: |
          cat("torch package:", requireNamespace("torch", quietly = TRUE), "\n")
          cat("LibTorch:", torch::torch_is_installed(), "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: false
